$kind: http-request
description: |-
  Returns a single announcement by ID including the author.

  **Who can call it:** Any authenticated user.

  **Auth:** Bearer token required.

  **Path params:**
  - `buildingId` (UUID, required)
  - `id` (UUID, required) — the announcement ID

  **Errors:**
  - `401` — not authenticated
  - `404` — announcement not found
url: "{{baseUrl}}/buildings/{{buildingId}}/announcements/{{announce1_id}}"
method: GET
headers:
  Authorization: Bearer {{authToken}}
order: 4000
