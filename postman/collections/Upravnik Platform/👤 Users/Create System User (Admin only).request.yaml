$kind: http-request
description: |-
  Creates a new system user (UPRAVNIK or BOARD_MEMBER). These are named accounts with email/password login. Only SUPER_ADMIN can call this.

  **Who can call it:** SUPER_ADMIN only.

  **Auth:** Bearer token required.

  **Body fields:**
  - `email` (string, required) — used as the username for login
  - `password` (string, required) — plaintext, hashed on the server
  - `role` (string, required) — `UPRAVNIK` or `BOARD_MEMBER`
  - `firstName` (string, optional)
  - `lastName` (string, optional)
  - `phone` (string, optional)

  **Response:** Created user object (password hash is never returned).

  **Errors:**
  - `401` — not authenticated
  - `403` — authenticated user is not SUPER_ADMIN
  - `409` — email already in use
url: "{{baseUrl}}/users/system"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
body:
  type: text
  content: |-
    {
      "email": "novi.upravnik@zgrada.rs",
      "password": "Password123!",
      "role": "UPRAVNIK",
      "firstName": "Novi",
      "lastName": "Upravnik",
      "phone": "+381601234567"
    }
order: 1000
