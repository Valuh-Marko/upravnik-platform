$kind: http-request
description: |-
  Generates a new random password for a unit account and returns it in plaintext. Use this when a resident forgets their password. The new password is returned only once — give it to the resident immediately.

  **Who can call it:** UPRAVNIK only.

  **Auth:** Bearer token required.

  **Path params:**
  - `userId` (UUID, required) — the unit account to reset

  **Errors:**
  - `401` — not authenticated
  - `403` — authenticated user is not UPRAVNIK
  - `404` — user not found
url: "{{baseUrl}}/users/{{userId}}/reset-password"
method: POST
headers:
  Authorization: Bearer {{authToken}}
order: 3000
