$kind: http-request
description: |-
  Generates a new random password for a unit account and returns it in plaintext. Use this when a resident or board member forgets their password. The new password is returned only once — give it to the user immediately.

  **Who can call it:** UPRAVNIK only (must be an UPRAVNIK of the specified building).

  **Auth:** Bearer token required.

  **Path params:**
  - `buildingId` (UUID, required) — the building the user belongs to (used to verify UPRAVNIK access)
  - `userId` (UUID, required) — the unit account to reset

  **Errors:**
  - `401` — not authenticated
  - `403` — authenticated user is not UPRAVNIK in this building
  - `404` — user not found
url: "{{baseUrl}}/users/{{buildingId}}/members/{{userId}}/reset-password"
method: POST
headers:
  Authorization: Bearer {{authToken}}
order: 4000
